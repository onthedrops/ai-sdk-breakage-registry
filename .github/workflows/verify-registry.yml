name: Verify Registry

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "generated/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/verify-registry.yml"
  pull_request:
    branches: [main]
    paths:
      - "data/**"
      - "generated/**"
      - "scripts/**"
      - "tests/**"
  schedule:
    # Weekly URL liveness check: Sundays at 09:00 UTC
    - cron: "0 9 * * 0"
  workflow_dispatch:
    inputs:
      check-urls:
        description: "Verify source URL liveness (network)"
        type: boolean
        default: false

jobs:
  # ── Deterministic checks: run on every push/PR ──
  verify:
    name: Structural & Self-Consistency Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pyyaml pytest

      - name: Run existing test suite
        run: python -m pytest tests/ -v

      - name: Verify registry entries (deterministic)
        run: python scripts/verify_registry.py

      - name: Check registry.json is in sync
        run: python scripts/build_registry.py --check

  # ── URL + content liveness: weekly schedule + manual dispatch ──
  url-check:
    name: Source URL & Content Verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      # Current known-warning count. Raising this should be a deliberate act,
      # not a silent one: if drift pushes the count above it, the run fails
      # and files an issue instead of passing quietly.
      WARNING_BUDGET: 19
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.check-urls == true)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Verify source URLs are live
        run: python scripts/verify_registry.py --check-urls --max-warnings=${{ env.WARNING_BUDGET }}

      - name: Verify source content matches registry entries
        run: python scripts/verify_registry.py --check-content --max-warnings=${{ env.WARNING_BUDGET }}

      - name: Open an issue when sources drift
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Source drift detected on $(date -u +%Y-%m-%d)" \
            --label "verification" \
            --body "The weekly verification run failed.

          A source URL is unreachable, or documentation has drifted far enough that
          the warning budget (\`${{ env.WARNING_BUDGET }}\`) was exceeded.

          Reproduce locally:

          \`\`\`bash
          python scripts/verify_registry.py --check-urls --check-content
          \`\`\`

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
