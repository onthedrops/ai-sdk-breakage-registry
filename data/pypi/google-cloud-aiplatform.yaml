package: google-cloud-aiplatform
ecosystem: pypi
from_version_range: "*"
to_version_range: "google-genai >=1.0.0"
severity: critical
category: package_renamed
summary: "Vertex AI SDK generative_models module (vertexai.generative_models) is deprecated as of June 24, 2025 and will be removed June 24, 2026. Must migrate to google-genai with Vertex backend."

changes:
  - symbol_before: "from vertexai.generative_models import GenerativeModel"
    symbol_after: "from google import genai; client = genai.Client(vertexai=True, ...)"
    change_type: import_path_changed
    before: |
      import vertexai
      vertexai.init(project="my-project", location="us-central1")
      from vertexai.generative_models import GenerativeModel
      model = GenerativeModel("gemini-1.5-pro")
      response = model.generate_content("Hello")
    after: |
      from google import genai
      client = genai.Client(
          vertexai=True,
          project="my-project",
          location="us-central1"
      )
      response = client.models.generate_content(
          model="gemini-2.5-flash",
          contents="Hello"
      )
    detection:
      regex:
        - "from vertexai\\.generative_models import"
      import_patterns:
        - "from vertexai.generative_models import"
        - "import vertexai"
    migration_note: "vertexai.generative_models is deprecated (June 24, 2025) and will be removed June 24, 2026. Install google-genai and use genai.Client(vertexai=True, project=..., location=...) to access Vertex AI backend."

  - symbol_before: "from vertexai.language_models import ChatModel"
    symbol_after: "client.models.generate_content(model=..., contents=...)"
    change_type: import_path_changed
    before: |
      from vertexai.language_models import ChatModel
      chat_model = ChatModel.from_pretrained("chat-bison")
      chat = chat_model.start_chat()
      response = chat.send_message("Hello")
    after: |
      from google import genai
      client = genai.Client(vertexai=True, project="my-project")
      response = client.models.generate_content(
          model="gemini-2.5-flash",
          contents="Hello"
      )
    detection:
      import_patterns:
        - "from vertexai.language_models import"
    migration_note: "vertexai.language_models deprecated. Use google-genai client.models.generate_content() with Gemini models."

  - symbol_before: "from vertexai.vision_models import ImageTextModel"
    symbol_after: "client.models.generate_content(model=..., contents=[image_part, ...])"
    change_type: import_path_changed
    before: |
      from vertexai.vision_models import ImageTextModel
      model = ImageTextModel.from_pretrained("imagetext")
    after: |
      from google import genai
      from google.genai import types
      client = genai.Client(vertexai=True, project="my-project")
      # Use generate_content with image parts
    detection:
      import_patterns:
        - "from vertexai.vision_models import"
    migration_note: "vertexai.vision_models deprecated. Use client.models.generate_content() with image parts in contents."

  - symbol_before: "vertexai.init(project=..., location=...)"
    symbol_after: "genai.Client(vertexai=True, project=..., location=...)"
    change_type: parameter_removed
    before: |
      import vertexai
      vertexai.init(project="my-project", location="us-central1")
    after: |
      from google import genai
      client = genai.Client(
          vertexai=True,
          project="my-project",
          location="us-central1"
      )
    detection:
      regex:
        - "vertexai\\.init\\("
    migration_note: "Module-level init() replaced by Client constructor with vertexai=True flag."

  - symbol_before: "import vertexai"
    symbol_after: "from google import genai"
    change_type: import_path_changed
    before: |
      import vertexai
      vertexai.init(project="my-project", location="us-central1")
    after: |
      from google import genai
      client = genai.Client(vertexai=True, project="my-project", location="us-central1")
    detection:
      import_patterns:
        - "import vertexai"
    migration_note: "The vertexai package is deprecated. Install google-genai and use genai.Client(vertexai=True, ...) for Vertex AI backend access."

  - symbol_before: "from vertexai.generative_models import Content, Part, HarmCategory, SafetySetting"
    symbol_after: "from google.genai import types"
    change_type: import_path_changed
    before: |
      from vertexai.generative_models import Content, Part, HarmCategory, SafetySetting
      part = Part.from_text("Hello")
      content = Content(parts=[part], role="user")
    after: |
      from google.genai import types
      part = types.Part.from_text(text="Hello")
      content = types.Content(parts=[part], role="user")
    detection:
      import_patterns:
        - "from vertexai.generative_models import Content"
        - "from vertexai.generative_models import Part"
        - "from vertexai.generative_models import HarmCategory"
        - "from vertexai.generative_models import SafetySetting"
    migration_note: "Content, Part, HarmCategory, and SafetySetting moved to google.genai.types. Import them from the types module."

  - symbol_before: "GenerativeModel('gemini-1.5-pro')"
    symbol_after: "client.models.generate_content(model=..., contents=...)"
    change_type: removed_class
    before: |
      from vertexai.generative_models import GenerativeModel
      model = GenerativeModel("gemini-1.5-pro")
      response = model.generate_content("Hello")
    after: |
      response = client.models.generate_content(
          model="gemini-2.5-flash",
          contents="Hello"
      )
    detection:
      regex:
        - "GenerativeModel\\("
    migration_note: "GenerativeModel class removed. Use client.models.generate_content(model=..., contents=...) directly. Pass the model name as a parameter."

  - symbol_before: "ChatModel.from_pretrained('chat-bison')"
    symbol_after: "client.models.generate_content(model=..., contents=...)"
    change_type: removed_method
    before: |
      from vertexai.language_models import ChatModel
      chat_model = ChatModel.from_pretrained("chat-bison")
      chat = chat_model.start_chat()
      response = chat.send_message("Hello")
    after: |
      response = client.models.generate_content(
          model="gemini-2.5-flash",
          contents="Hello"
      )
    detection:
      regex:
        - "ChatModel\\.from_pretrained"
    migration_note: "ChatModel.from_pretrained() removed. PaLM chat models are deprecated. Use client.models.generate_content() with Gemini models."

  - symbol_before: "TextGenerationModel.from_pretrained('text-bison')"
    symbol_after: "client.models.generate_content(model=..., contents=...)"
    change_type: removed_method
    before: |
      from vertexai.language_models import TextGenerationModel
      text_model = TextGenerationModel.from_pretrained("text-bison")
      response = text_model.predict("Write a summary")
    after: |
      response = client.models.generate_content(
          model="gemini-2.5-flash",
          contents="Write a summary"
      )
    detection:
      regex:
        - "TextGenerationModel\\.from_pretrained"
    migration_note: "TextGenerationModel.from_pretrained() removed. PaLM text models are deprecated. Use client.models.generate_content() with Gemini models."

  - symbol_before: "ImageTextModel.from_pretrained('imagetext')"
    symbol_after: "client.models.generate_content(model=..., contents=[image_part, ...])"
    change_type: removed_method
    before: |
      from vertexai.vision_models import ImageTextModel, Image
      vision_model = ImageTextModel.from_pretrained("imagetext")
      image = Image.load_from_file("photo.jpg")
      captions = vision_model.get_captions(image)
    after: |
      from google.genai import types
      # Upload image file and use in contents
      file = client.files.upload(file="photo.jpg")
      response = client.models.generate_content(
          model="gemini-2.5-flash",
          contents=[file, "Describe this image"]
      )
    detection:
      regex:
        - "ImageTextModel\\.from_pretrained"
    migration_note: "ImageTextModel.from_pretrained() removed. Use client.models.generate_content() with image parts in contents. Upload files via client.files.upload()."

  - symbol_before: "model.generate_content(...)"
    symbol_after: "client.models.generate_content(model=..., contents=...)"
    change_type: renamed_method
    before: |
      model = GenerativeModel("gemini-1.5-pro")
      response = model.generate_content("Hello, world!")
    after: |
      response = client.models.generate_content(
          model="gemini-2.5-flash",
          contents="Hello, world!"
      )
    detection:
      regex:
        - "model\\.generate_content\\("
    migration_note: "model.generate_content() removed. Use client.models.generate_content(model=..., contents=...)."

  - symbol_before: "model.generate_content_stream(...)"
    symbol_after: "client.models.generate_content_stream(model=..., contents=...)"
    change_type: renamed_method
    before: |
      model = GenerativeModel("gemini-1.5-pro")
      for chunk in model.generate_content_stream("Tell me a story"):
          print(chunk.text)
    after: |
      for chunk in client.models.generate_content_stream(
          model="gemini-2.5-flash",
          contents="Tell me a story"
      ):
          print(chunk.text)
    detection:
      regex:
        - "model\\.generate_content_stream\\("
    migration_note: "Streaming moved to client.models.generate_content_stream(). Same parameters as generate_content."

  - symbol_before: "model.start_chat(...)"
    symbol_after: "client.chats.create(model=...)"
    change_type: renamed_method
    before: |
      model = GenerativeModel("gemini-1.5-pro")
      chat = model.start_chat()
      response = chat.send_message("Hello!")
    after: |
      chat = client.chats.create(model="gemini-2.5-flash")
      response = chat.send_message("Hello!")
    detection:
      regex:
        - "model\\.start_chat\\("
    migration_note: "model.start_chat() removed. Use client.chats.create(model=...) to create a chat session."

  - symbol_before: "Part.from_text(...)"
    symbol_after: "types.Part.from_text(text=...)"
    change_type: renamed_method
    before: |
      from vertexai.generative_models import Part
      part = Part.from_text("Hello")
    after: |
      from google.genai import types
      part = types.Part.from_text(text="Hello")
    detection:
      regex:
        - "Part\\.from_text\\("
    migration_note: "Part.from_text() moved to types.Part.from_text(text=...) in google.genai. The parameter is now keyword-only."

  - symbol_before: "chat.send_message(...)"
    symbol_after: "client.chats.send_message(message=...) or client.models.generate_content(...)"
    change_type: parameter_renamed
    before: |
      chat = model.start_chat()
      response = chat.send_message("Hello!")
    after: |
      chat = client.chats.create(model="gemini-2.5-flash")
      response = chat.send_message(message="Hello!")
    detection:
      regex:
        - "\\.send_message\\("
    migration_note: "chat.send_message() API changed. Use client.chats.send_message(message=...) with the new chat session API."

  - symbol_before: "Image.load_from_file(...)"
    symbol_after: "client.files.upload(file=...)"
    change_type: removed_method
    before: |
      from vertexai.vision_models import Image
      image = Image.load_from_file("photo.jpg")
    after: |
      # Upload the file and reference it in contents
      file = client.files.upload(file="photo.jpg")
      response = client.models.generate_content(
          model="gemini-2.5-flash",
          contents=[file, "Describe this image"]
      )
    detection:
      regex:
        - "Image\\.load_from_file\\("
    migration_note: "Image.load_from_file() removed. Use client.files.upload(file=...) to upload files and reference them in generate_content contents."

  - symbol_before: "TextGenerationModel.predict(...)"
    symbol_after: "client.models.generate_content(model=..., contents=...)"
    change_type: removed_method
    before: |
      text_model = TextGenerationModel.from_pretrained("text-bison")
      response = text_model.predict("Write a summary")
    after: |
      response = client.models.generate_content(
          model="gemini-2.5-flash",
          contents="Write a summary"
      )
    detection:
      regex:
        - "\\.predict\\("
    migration_note: "TextGenerationModel.predict() removed. PaLM text models are deprecated. Use client.models.generate_content() with Gemini models."

sources:
