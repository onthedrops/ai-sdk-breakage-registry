package: google-generativeai
ecosystem: pypi
from_version_range: "*"
to_version_range: "google-genai >=1.0.0"
severity: critical
category: package_renamed
summary: "google-generativeai package is deprecated and archived. Replaced by google-genai with a completely different client-based API. Old code using genai.configure() and GenerativeModel() will break."

changes:
  - symbol_before: "import google.generativeai as genai"
    symbol_after: "from google import genai"
    change_type: import_path_changed
    before: |
      import google.generativeai as genai
      genai.configure(api_key="AIza...")
    after: |
      from google import genai
      client = genai.Client(api_key="AIza...")
    detection:
      regex:
        - "import google\\.generativeai"
      import_patterns:
        - "import google.generativeai"
        - "from google.generativeai"
    migration_note: "The google-generativeai package is deprecated (archived Dec 2025). Install google-genai instead. The new SDK uses a Client instance rather than module-level configuration."

  - symbol_before: "genai.configure(api_key=...)"
    symbol_after: "client = genai.Client(api_key=...)"
    change_type: parameter_removed
    before: |
      import google.generativeai as genai
      genai.configure(api_key="AIza...")
    after: |
      from google import genai
      client = genai.Client(api_key="AIza...")
    detection:
      regex:
        - "genai\\.configure\\("
    migration_note: "Module-level configure() removed. Create a Client instance with the API key passed to the constructor."

  - symbol_before: "genai.GenerativeModel('gemini-pro')"
    symbol_after: "client.models.generate_content(model=..., contents=...)"
    change_type: renamed_method
    before: |
      import google.generativeai as genai
      genai.configure(api_key="AIza...")
      model = genai.GenerativeModel('gemini-pro')
      response = model.generate_content("Hello")
      print(response.text)
    after: |
      from google import genai
      client = genai.Client(api_key="AIza...")
      response = client.models.generate_content(
          model="gemini-2.5-flash",
          contents="Hello"
      )
      print(response.text)
    detection:
      regex:
        - "genai\\.GenerativeModel\\("
        - "model\\.generate_content\\("
    migration_note: "GenerativeModel class removed. Use client.models.generate_content() directly with model and contents parameters."

  - symbol_before: "model.generate_content_stream(...)"
    symbol_after: "client.models.generate_content_stream(model=..., contents=...)"
    change_type: renamed_method
    before: |
      model = genai.GenerativeModel('gemini-pro')
      for chunk in model.generate_content_stream("Tell me a story"):
          print(chunk.text)
    after: |
      for chunk in client.models.generate_content_stream(
          model="gemini-2.5-flash",
          contents="Tell me a story"
      ):
          print(chunk.text)
    detection:
      regex:
        - "generate_content_stream\\("
    migration_note: "Streaming moved to client.models.generate_content_stream(). Same parameters as generate_content."

  - symbol_before: "from google.generativeai import caching"
    symbol_after: "client.caches"
    change_type: import_path_changed
    before: |
      from google.generativeai import caching
      cache = caching.CachedContent.create(...)
    after: |
      # No separate import; use client.caches
      cache = client.caches.create(...)
    detection:
      import_patterns:
        - "from google.generativeai import caching"
    migration_note: "Caching module removed. Use client.caches directly."

  - symbol_before: "generation_config=genai.types.GenerationConfig(...)"
    symbol_after: "config=types.GenerateContentConfig(...)"
    change_type: parameter_renamed
    before: |
      response = model.generate_content(
          "Hello",
          generation_config=genai.types.GenerationConfig(
              temperature=0.7,
              max_output_tokens=100
          )
      )
    after: |
      from google.genai import types
      response = client.models.generate_content(
          model="gemini-2.5-flash",
          contents="Hello",
          config=types.GenerateContentConfig(
              temperature=0.7,
              max_output_tokens=100
          )
      )
    detection:
      regex:
        - "generation_config="
    migration_note: "generation_config parameter renamed to config. Use types.GenerateContentConfig from google.genai."

  - symbol_before: "from google.generativeai import types"
    symbol_after: "from google.genai import types"
    change_type: import_path_changed
    before: |
      from google.generativeai import types
      config = types.GenerationConfig(temperature=0.7)
    after: |
      from google.genai import types
      config = types.GenerateContentConfig(temperature=0.7)
    detection:
      import_patterns:
        - "from google.generativeai import types"
    migration_note: "Types module moved from google.generativeai to google.genai."

  - symbol_before: "genai.types.GenerationConfig(...)"
    symbol_after: "types.GenerateContentConfig(...)"
    change_type: renamed_class
    before: |
      config = genai.types.GenerationConfig(
          temperature=0.7,
          max_output_tokens=100
      )
    after: |
      from google.genai import types
      config = types.GenerateContentConfig(
          temperature=0.7,
          max_output_tokens=100
      )
    detection:
      regex:
        - "genai\\.types\\.GenerationConfig"
    migration_note: "GenerationConfig class renamed to types.GenerateContentConfig. Import types from google.genai."

  - symbol_before: "model.generate_content(...)"
    symbol_after: "client.models.generate_content(model=..., contents=...)"
    change_type: renamed_method
    before: |
      model = genai.GenerativeModel('gemini-pro')
      response = model.generate_content("Hello")
    after: |
      response = client.models.generate_content(
          model="gemini-2.5-flash",
          contents="Hello"
      )
    detection:
      regex:
        - "model\\.generate_content\\("
    migration_note: "model.generate_content() removed. Use client.models.generate_content(model=..., contents=...). The model name is now passed as a parameter."

  - symbol_before: "model.start_chat(...)"
    symbol_after: "client.chats.create(model=...)"
    change_type: renamed_method
    before: |
      model = genai.GenerativeModel('gemini-pro')
      chat = model.start_chat(history=[])
      response = chat.send_message("Hello!")
    after: |
      chat = client.chats.create(model="gemini-2.5-flash")
      response = chat.send_message("Hello!")
    detection:
      regex:
        - "model\\.start_chat\\("
    migration_note: "model.start_chat() removed. Use client.chats.create(model=...) to create a chat session."

  - symbol_before: "caching.CachedContent.create(...)"
    symbol_after: "client.caches.create(...)"
    change_type: renamed_method
    before: |
      from google.generativeai import caching
      cache = caching.CachedContent.create(
          model="gemini-pro",
          display_name="my-cache",
          system_instruction="You are helpful"
      )
    after: |
      cache = client.caches.create(
          model="gemini-2.5-flash",
          display_name="my-cache",
          config={'system_instruction': 'You are helpful'}
      )
    detection:
      regex:
        - "caching\\.CachedContent\\.create"
    migration_note: "caching.CachedContent.create() removed. Use client.caches.create(...) directly. No separate import needed."

