    detection:
      regex:
        - "RetrievalQA"
    migration_note: "RetrievalQA deprecated in v0.1.17. Replace with create_retrieval_chain() + create_history_aware_retriever(). Requires structural rewrite. See: https://python.langchain.com/v0.2/docs/versions/migrating_chains/"

  - symbol_before: "ConversationalRetrievalChain.from_llm(llm, retriever)"
