    detection:
      regex:
        - "ConversationalRetrievalChain"
    migration_note: "ConversationalRetrievalChain deprecated in v0.1.17. Replace with create_history_aware_retriever() + create_retrieval_chain(). Requires structural rewrite."

  - symbol_before: "create_extraction_chain(schema, llm)"
