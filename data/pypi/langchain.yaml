    migration_note: "create_structured_output_chain deprecated in v0.1.1. Replace with ChatModel.with_structured_output(). Also: create_structured_output_runnable and create_openai_fn_runnable deprecated in v0.1.14."

  - symbol_before: "create_openai_fn_chain(functions, llm)"
