      from langchain_core.prompts import ChatPromptTemplate
      from langchain_core.runnables import RunnablePassthrough
      chain = ({\"context\": vs.as_retriever(), \"question\": RunnablePassthrough()} | prompt | llm | StrOutputParser())
      answer = chain.invoke(question)
    detection:
      regex:
        - "VectorStoreIndexWrapper"
    migration_note: "VectorStoreIndexWrapper.query/query_with_sources/aquery_with_sources deprecated. Pass an explicit LLM. Also: VectorStoreIndexCreator requires explicit embedding model. Requires structural rewrite."

  - symbol_before: "FlareChain.from_llm_and_retriever(llm, retriever)"
    symbol_after: ""
    change_type: api_removed
    before: |
      from langchain.chains import FlareChain
      chain = FlareChain.from_llm_and_retriever(llm, retriever)
    after: ""
    detection:
      regex:
        - "FlareChain"
    migration_note: "FlareChain deprecated. Pass an explicit LLM. Requires structural rewrite."

  - symbol_before: "NatBotChain.from_default(llm)"
    symbol_after: "NatBotChain.from_llm(llm)"
    change_type: method_renamed
    before: |
      from langchain.natbot import NatBotChain
      chain = NatBotChain.from_default(llm)
    after: |
      from langchain.natbot import NatBotChain
      chain = NatBotChain.from_llm(llm)
    detection:
      regex:
        - "from_default\\("
    migration_note: "NatBotChain.from_default() removed. Use from_llm() class method instead."

  - symbol_before: "try_load_from_hub(repo_id)"
    symbol_after: ""
    change_type: api_removed
    before: |
      from langchain_core.utils.loading import try_load_from_hub
      obj = try_load_from_hub(repo_id)
    after: ""
    detection:
      regex:
        - "try_load_from_hub"
    migration_note: "try_load_from_hub deprecated in v0.1.30. Using hwchase17/langchain-hub repo for prompts is deprecated. Use https://smith.langchain.com/hub instead."

  - symbol_before: "from langchain.retrievers.document_compressors import CohereRerank"
    symbol_after: "from langchain_cohere import CohereRerank"
    change_type: import_path_changed
    before: |
      from langchain.retrievers.document_compressors import CohereRerank
    after: |
      from langchain_cohere import CohereRerank
    detection:
      regex:
        - "from langchain\\.retrievers\\.document_compressors import.*CohereRerank"
    migration_note: "CohereRerank moved to langchain-cohere provider package. Install with pip install langchain-cohere."

  - symbol_before: "RunTypeEnum"
    symbol_after: "Use string instead"
    change_type: api_removed
    before: |
      from langchain_core.tracers.schemas import RunTypeEnum, TracerSessionV1, BaseRun, LLMRun, ChainRun, ToolRun
    after: |
      from langchain_core.tracers.schemas import Run
    detection:
      regex:
        - "RunTypeEnum|TracerSessionV1|BaseRun|LLMRun|ChainRun|ToolRun"
    migration_note: "Tracer schema classes deprecated since v0.1.0: RunTypeEnum (use string), TracerSessionV1/Base/Create (no replacement), BaseRun/LLMRun/ChainRun/ToolRun (use Run). All scheduled for removal in v0.3.0."

  - symbol_before: "astream_events(version='v1')"
    symbol_after: "astream_events(version='v2')"
    change_type: api_removed
    before: |
      async for event in llm.astream_events(input, version='v1'):
          ...
    after: |
      async for event in llm.astream_events(input, version='v2'):
          ...
    detection:
      regex:
        - "astream_events.*v1"
    migration_note: "astream_events V1 is deprecated. Migrate to V2. See: https://python.langchain.com/v0.2/docs/versions/migrating_astream_events/"

  - symbol_before: "@tool decorator (old behavior)"
    symbol_after: "@tool decorator (new behavior)"
    change_type: behavior_changed
    before: |
      @tool
      def my_tool(x: str) -> str:
          \"\"\"Some description.\"\"\"
          return \"something\"
      # my_tool.description == 'my_tool: (x: str) -> str - Some description.'
    after: |
      @tool
      def my_tool(x: str) -> str:
          \"\"\"Some description.\"\"\"
          return \"something\"
      # my_tool.description == 'Some description.'
    detection:
      regex:
        - "@tool"
    migration_note: "The @tool decorator behavior changed in v0.2.0. The tool description is now the function docstring only (no longer includes function signature). Manual review of tool descriptions may be needed."

