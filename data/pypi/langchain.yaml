package: langchain
ecosystem: pypi
from_version_range: ">=0.1.0,<0.2.0"
to_version_range: ">=0.2.0"
severity: high
category: api_break
summary: "LangChain v0.2 extracted langchain-core as a separate package, moved ChatModels to provider packages, and changed import paths from langchain.* to langchain_core.*"

changes:
  - symbol_before: "from langchain.schema import HumanMessage, AIMessage, SystemMessage"
    symbol_after: "from langchain_core.messages import HumanMessage, AIMessage, SystemMessage"
    change_type: import_path_changed
    before: |
      from langchain.schema import HumanMessage, AIMessage, SystemMessage
    after: |
      from langchain_core.messages import HumanMessage, AIMessage, SystemMessage
    detection:
      regex:
        - "from langchain\\.schema import.*Message"
      import_patterns:
        - "from langchain.schema import"
    migration_note: "Message types moved to langchain_core.messages. Run langchain-cli migrate to auto-fix imports."

  - symbol_before: "from langchain.chat_models import ChatOpenAI"
    symbol_after: "from langchain_openai import ChatOpenAI"
    change_type: import_path_changed
    before: |
      from langchain.chat_models import ChatOpenAI
      llm = ChatOpenAI(model="gpt-4")
    after: |
      from langchain_openai import ChatOpenAI
      llm = ChatOpenAI(model="gpt-4")
    detection:
      regex:
        - "from langchain\\.chat_models import"
      import_patterns:
        - "from langchain.chat_models import"
    migration_note: "ChatModels moved to provider packages. Install langchain-openai, langchain-anthropic, etc. Run langchain-cli migrate."

  - symbol_before: "from langchain.embeddings import OpenAIEmbeddings"
    symbol_after: "from langchain_openai import OpenAIEmbeddings"
    change_type: import_path_changed
    before: |
      from langchain.embeddings import OpenAIEmbeddings
    after: |
      from langchain_openai import OpenAIEmbeddings
    detection:
      regex:
        - "from langchain\\.embeddings import"
    migration_note: "Embedding models moved to provider packages."

  - symbol_before: "from langchain.vectorstores import Chroma"
    symbol_after: "from langchain_community.vectorstores import Chroma"
    change_type: import_path_changed
    before: |
      from langchain.vectorstores import Chroma
    after: |
      from langchain_community.vectorstores import Chroma
    detection:
      regex:
        - "from langchain\\.vectorstores import"
    migration_note: "Vector stores moved to langchain-community package. Provider-specific stores (Chroma, Pinecone) have separate packages: langchain-chroma, langchain-pinecone, etc."

  - symbol_before: "from langchain.llms import OpenAI"
    symbol_after: "from langchain_openai import OpenAI"
    change_type: import_path_changed
    before: |
      from langchain.llms import OpenAI
    after: |
      from langchain_openai import OpenAI
    detection:
      regex:
        - "from langchain\\.llms import"
    migration_note: "LLM classes moved to provider packages. Note: LLMs (non-chat) are being deprecated in favor of ChatModels."

  - symbol_before: "langchain.ChatOpenAI(...)  # without specifying model"
    symbol_after: "langchain_openai.ChatOpenAI(model='gpt-4')  # model required"
    change_type: parameter_required
    before: |
      from langchain.chat_models import ChatOpenAI
      llm = ChatOpenAI()  # defaulted to a model
    after: |
      from langchain_openai import ChatOpenAI
      llm = ChatOpenAI(model="gpt-4")  # must specify explicitly
    detection:
      regex:
        - "ChatOpenAI\\(\\)"
    migration_note: "LangChain 0.2 requires explicit model/LLM specification. No more default model instantiation."

  - symbol_before: "from langchain.schema.document import Document"
    symbol_after: "from langchain_core.documents import Document"
    change_type: import_path_changed
    before: |
      from langchain.schema.document import Document
    after: |
      from langchain_core.documents import Document
    detection:
      regex:
        - "from langchain\\.schema\\.document import"
    migration_note: "Document class moved from langchain.schema.document to langchain_core.documents."

  - symbol_before: "from langchain.text_splitter import RecursiveCharacterTextSplitter"
    symbol_after: "from langchain_text_splitters import RecursiveCharacterTextSplitter"
    change_type: import_path_changed
    before: |
      from langchain.text_splitter import RecursiveCharacterTextSplitter
    after: |
      from langchain_text_splitters import RecursiveCharacterTextSplitter
    detection:
      regex:
        - "from langchain\\.text_splitter import"
    migration_note: "Text splitters moved to langchain-text-splitters package. Install with pip install langchain-text-splitters."

  - symbol_before: "from langchain.document_loaders import UnstructuredMarkdownLoader"
    symbol_after: "from langchain_community.document_loaders import UnstructuredMarkdownLoader"
    change_type: import_path_changed
    before: |
      from langchain.document_loaders import UnstructuredMarkdownLoader
    after: |
      from langchain_community.document_loaders import UnstructuredMarkdownLoader
    detection:
      regex:
        - "from langchain\\.document_loaders import"
    migration_note: "Document loaders moved to langchain-community package. Install langchain-community."

  - symbol_before: "from langchain_community.chat_models import ChatOpenAI"
    symbol_after: "from langchain_openai import ChatOpenAI"
    change_type: import_path_changed
    before: |
      from langchain_community.chat_models import ChatOpenAI
    after: |
      from langchain_openai import ChatOpenAI
    detection:
      regex:
        - "from langchain_community\\.chat_models import ChatOpenAI"
    migration_note: "ChatOpenAI moved from langchain-community to langchain-openai provider package. Install langchain-openai."

  - symbol_before: "from langchain_community.embeddings import OpenAIEmbeddings"
    symbol_after: "from langchain_openai import OpenAIEmbeddings"
    change_type: import_path_changed
    before: |
      from langchain_community.embeddings import OpenAIEmbeddings
    after: |
      from langchain_openai import OpenAIEmbeddings
    detection:
      regex:
        - "from langchain_community\\.embeddings import OpenAIEmbeddings"
    migration_note: "OpenAIEmbeddings moved from langchain-community to langchain-openai provider package."

  - symbol_before: "from langchain_community.llms import OpenAI"
    symbol_after: "from langchain_openai import OpenAI"
    change_type: import_path_changed
    before: |
      from langchain_community.llms import OpenAI
    after: |
      from langchain_openai import OpenAI
    detection:
      regex:
        - "from langchain_community\\.llms import OpenAI"
    migration_note: "OpenAI LLM moved from langchain-community to langchain-openai provider package."

  - symbol_before: "from langchain.utils.function_calling import convert_pydantic_to_openai_function"
    symbol_after: "from langchain_core.utils.function_calling import convert_to_openai_function"
    change_type: import_path_changed
    before: |
      from langchain.utils.function_calling import convert_pydantic_to_openai_function
    after: |
      from langchain_core.utils.function_calling import convert_to_openai_function
    detection:
      regex:
        - "from langchain\\.utils\\.function_calling import"
    migration_note: "Function calling utilities moved from langchain.utils to langchain_core.utils. Function names also changed: convert_pydantic_to_openai_function -> convert_to_openai_function, etc."

  - symbol_before: "convert_pydantic_to_openai_function"
    symbol_after: "convert_to_openai_function"
    change_type: renamed_function
    before: |
      convert_pydantic_to_openai_function(pydantic_model)
    after: |
      convert_to_openai_function(pydantic_model)
    detection:
      regex:
        - "convert_pydantic_to_openai_function"
    migration_note: "Function renamed. Also update import: from langchain_core.utils.function_calling import convert_to_openai_function."

  - symbol_before: "convert_pydantic_to_openai_tool"
    symbol_after: "convert_to_openai_tool"
    change_type: renamed_function
    before: |
      convert_pydantic_to_openai_tool(pydantic_model)
    after: |
      convert_to_openai_tool(pydantic_model)
    detection:
      regex:
        - "convert_pydantic_to_openai_tool"
    migration_note: "Function renamed. Also update import: from langchain_core.utils.function_calling import convert_to_openai_tool."

  - symbol_before: "convert_python_function_to_openai_function"
    symbol_after: "convert_to_openai_function"
    change_type: renamed_function
    before: |
      convert_python_function_to_openai_function(func)
    after: |
      convert_to_openai_function(func)
    detection:
      regex:
        - "convert_python_function_to_openai_function"
    migration_note: "Function renamed to convert_to_openai_function. Update import: from langchain_core.utils.function_calling import convert_to_openai_function."

  - symbol_before: "format_tool_to_openai_function"
    symbol_after: "convert_to_openai_function"
    change_type: renamed_function
    before: |
      format_tool_to_openai_function(tool)
    after: |
      convert_to_openai_function(tool)
    detection:
      regex:
        - "format_tool_to_openai_function"
    migration_note: "Function renamed to convert_to_openai_function. Update import: from langchain_core.utils.function_calling import convert_to_openai_function."

  - symbol_before: "format_tool_to_openai_tool"
    symbol_after: "convert_to_openai_tool"
    change_type: renamed_function
    before: |
      format_tool_to_openai_tool(tool)
    after: |
      convert_to_openai_tool(tool)
    detection:
      regex:
        - "format_tool_to_openai_tool"
    migration_note: "Function renamed to convert_to_openai_tool. Update import: from langchain_core.utils.function_calling import convert_to_openai_tool."

  - symbol_before: "retriever.get_relevant_documents(query)"
    symbol_after: "retriever.invoke(query)"
    change_type: method_renamed
    before: |
      docs = retriever.get_relevant_documents(query)
    after: |
      docs = retriever.invoke(query)
    detection:
      regex:
        - "\\.get_relevant_documents\\("
    migration_note: "BaseRetriever.get_relevant_documents() deprecated in favor of .invoke(). Same arguments, same return type."

  - symbol_before: "retriever.aget_relevant_documents(query)"
    symbol_after: "retriever.ainvoke(query)"
    change_type: method_renamed
    before: |
      docs = await retriever.aget_relevant_documents(query)
    after: |
      docs = await retriever.ainvoke(query)
    detection:
      regex:
        - "\\.aget_relevant_documents\\("
    migration_note: "BaseRetriever.aget_relevant_documents() deprecated in favor of .ainvoke(). Same arguments, same return type."

  - symbol_before: "initialize_agent(tools, llm, agent=AgentType.ZERO_SHOT_REACT_DESCRIPTION)"
    symbol_after: "create_react_agent(llm, tools)"
    change_type: api_removed
    before: |
      from langchain.agents import initialize_agent, AgentType
      agent = initialize_agent(tools, llm, agent=AgentType.ZERO_SHOT_REACT_DESCRIPTION)
    after: |
      from langchain.agents import create_react_agent
      agent = create_react_agent(llm, tools)
    detection:
      regex:
        - "initialize_agent\\("
    migration_note: "initialize_agent() deprecated. Use create_react_agent(), create_json_agent(), create_structured_chat_agent(), etc. Requires manual migration as constructor signatures differ."

  # ── Manual migration warnings (no auto-fix — require structural code changes) ──

  - symbol_before: "chain.run(query)"
    symbol_after: "chain.invoke(query)"
    change_type: method_renamed
    before: |
      result = chain.run(query)
    after: |
      result = chain.invoke(query)
    detection:
      regex:
        - "\\.run\\("
    migration_note: "Chain.run() deprecated in favor of .invoke(). Also: .call() -> .invoke(), .acall() -> .ainvoke(), .arun() -> .ainvoke(), .apply() -> .batch(). Manual migration required — too generic for auto-fix (matches subprocess.run, etc.)."

  - symbol_before: "llm.predict(text)"
    symbol_after: "llm.invoke(text)"
    change_type: method_renamed
    before: |
      result = llm.predict(text)
    after: |
      result = llm.invoke(text)
    detection:
      regex:
        - "\\.predict\\("
    migration_note: "BaseLanguageModel.predict() deprecated in favor of .invoke(). Also: .predict_messages() -> .invoke(), .apredict() -> .ainvoke(), .apredict_messages() -> .ainvoke(). Affects BaseChatModel and BaseLLM subclasses. Manual migration required — too generic for auto-fix."

  - symbol_before: "llm.call_as_llm(text)"
    symbol_after: "llm.invoke(text)"
    change_type: method_renamed
    before: |
      result = llm.call_as_llm(text)
    after: |
      result = llm.invoke(text)
    detection:
      regex:
        - "\\.call_as_llm\\("
    migration_note: "BaseChatModel.call_as_llm() deprecated in favor of .invoke(). Also: .call() -> .invoke() on BaseChatModel, BaseLLM, and BaseTool. Manual migration required."

  - symbol_before: "tool.call(input)"
    symbol_after: "tool.invoke(input)"
    change_type: method_renamed
    before: |
      result = tool.call(input)
    after: |
      result = tool.invoke(input)
    detection:
      regex:
        - "\\.call\\("
    migration_note: "BaseTool.call() deprecated in favor of .invoke(). Manual migration required — too generic for auto-fix."

  - symbol_before: "LLMChain(llm=llm, prompt=prompt)"
    symbol_after: "prompt | llm"
    change_type: api_removed
    before: |
      from langchain.chains import LLMChain
      chain = LLMChain(llm=llm, prompt=prompt)
    after: |
      chain = prompt | llm
    detection:
      regex:
        - "LLMChain\\("
    migration_note: "LLMChain deprecated in v0.1.17. Replace with LCEL: prompt | llm. Requires structural rewrite. See: https://python.langchain.com/v0.2/docs/versions/migrating_chains/"

  - symbol_before: "RetrievalQA.from_chain_type(llm, retriever)"
    symbol_after: "create_retrieval_chain(llm, retriever)"
